# Planta fixa: instale config-template-card no HACS e copie todas as imagens.
# Revise weather.forecast_home, IDs e posições de ícones conforme a sua instalação.
type: vertical-stack
cards:
  - type: weather-forecast
    entity: weather.forecast_home
    show_current: true
    show_forecast: false
  - type: custom:config-template-card
    entities:
      - sun.sun
      - switch.luzes_da_sala_switch_1
      - switch.luzes_da_sala_switch_2
      - light.luz_da_cozinha
      - switch.luz_do_corredor_switch_1
      - light.luz_do_quarto
      - input_boolean.luz_virtual_quarto_1
      - media_player.tv_samsung
      - media_player.aoc_h302x_44b3
    card:
      type: picture-elements
      image: "${states['sun.sun'] && states['sun.sun'].state === 'above_horizon' ? '/local/planta3d/planta-fixa/dia.png' : '/local/planta3d/planta-fixa/noite.png'}"
      elements:
        # Camada visual: Sala de estar
        - type: image
          image: /local/planta3d/planta-fixa/luz_sala_1.png
          style:
            left: 50%
            top: 50%
            width: 100%
            pointer-events: none
            mix-blend-mode: screen
            opacity: "${states['switch.luzes_da_sala_switch_1'] && states['switch.luzes_da_sala_switch_1'].state === 'on' ? 1 : 0}"
        # Camada visual: Sala de jantar
        - type: image
          image: /local/planta3d/planta-fixa/luz_sala_2.png
          style:
            left: 50%
            top: 50%
            width: 100%
            pointer-events: none
            mix-blend-mode: screen
            opacity: "${states['switch.luzes_da_sala_switch_2'] && states['switch.luzes_da_sala_switch_2'].state === 'on' ? 1 : 0}"
        # Camada visual: Cozinha
        - type: image
          image: /local/planta3d/planta-fixa/luz_cozinha.png
          style:
            left: 50%
            top: 50%
            width: 100%
            pointer-events: none
            mix-blend-mode: screen
            opacity: "${states['light.luz_da_cozinha'] && states['light.luz_da_cozinha'].state === 'on' ? 1 : 0}"
        # Camada visual: Corredor
        - type: image
          image: /local/planta3d/planta-fixa/luz_corredor.png
          style:
            left: 50%
            top: 50%
            width: 100%
            pointer-events: none
            mix-blend-mode: screen
            opacity: "${states['switch.luz_do_corredor_switch_1'] && states['switch.luz_do_corredor_switch_1'].state === 'on' ? 1 : 0}"
        # Camada visual: Seu quarto
        - type: image
          image: /local/planta3d/planta-fixa/luz_quarto.png
          style:
            left: 50%
            top: 50%
            width: 100%
            pointer-events: none
            mix-blend-mode: screen
            opacity: "${states['light.luz_do_quarto'] && states['light.luz_do_quarto'].state === 'on' ? (states['light.luz_do_quarto'].attributes.brightness == null ? 1 : Math.max(0, Math.min(1, states['light.luz_do_quarto'].attributes.brightness / 255))) : 0}"
            filter: "${states['light.luz_do_quarto'] && states['light.luz_do_quarto'].attributes.hs_color ? 'hue-rotate(' + (states['light.luz_do_quarto'].attributes.hs_color[0] - 40) + 'deg) saturate(' + Math.max(0, states['light.luz_do_quarto'].attributes.hs_color[1]) + '%)' : 'none'}"
        # Camada visual: Luz virtual do outro quarto
        - type: image
          image: /local/planta3d/planta-fixa/luz_quarto_1.png
          style:
            left: 50%
            top: 50%
            width: 100%
            pointer-events: none
            mix-blend-mode: screen
            opacity: "${states['input_boolean.luz_virtual_quarto_1'] && states['input_boolean.luz_virtual_quarto_1'].state === 'on' ? 1 : 0}"
        # Camada visual: TV da sala
        - type: image
          image: /local/planta3d/planta-fixa/tv_sala.png
          style:
            left: 50%
            top: 50%
            width: 100%
            pointer-events: none
            mix-blend-mode: screen
            opacity: "${states['media_player.tv_samsung'] && ['on', 'playing', 'paused', 'idle', 'buffering'].includes(states['media_player.tv_samsung'].state) ? 1 : 0}"
        # Camada visual: TV do quarto
        - type: image
          image: /local/planta3d/planta-fixa/tv_quarto.png
          style:
            left: 50%
            top: 50%
            width: 100%
            pointer-events: none
            mix-blend-mode: screen
            opacity: "${states['media_player.aoc_h302x_44b3'] && ['on', 'playing', 'paused', 'idle', 'buffering'].includes(states['media_player.aoc_h302x_44b3'].state) ? 1 : 0}"
        # Controle: Sala de estar
        - type: state-icon
          entity: switch.luzes_da_sala_switch_1
          title: Sala de estar
          icon: mdi:ceiling-light
          style:
            top: 37.42%
            left: 75.21%
            transform: translate(-50%, -50%)
            border-radius: 50%
            background: rgba(20, 24, 31, 0.68)
            padding: 4px
            --paper-item-icon-color: "#d6d6d6"
            --paper-item-icon-active-color: "#ffd16b"
          tap_action:
            action: toggle
          hold_action:
            action: more-info
        # Controle: Sala de jantar
