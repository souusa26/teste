      - type: state-icon
        entity: input_boolean.luz_virtual_quarto_1
        title: Luz virtual do outro quarto
        icon: mdi:lightbulb-outline
        style:
          top: 31.25%
          left: 27.19%
          transform: translate(-50%, -50%)
          border-radius: 50%
          background: radial-gradient(circle, rgba(20, 24, 31, 0.70) 0 14px, transparent 15px)
          padding: 0px
          --paper-item-icon-color: '#d6d6d6'
          --paper-item-icon-active-color: '#ffd16b'
          --mdc-icon-size: 18px
        tap_action:
          action: toggle
        hold_action:
          action: more-info
      - type: state-icon
        entity: media_player.tv_samsung
        title: TV da sala
        icon: mdi:television
        style:
          top: 44.1%
          left: 83.57%
          transform: translate(-50%, -50%)
          border-radius: 50%
          background: radial-gradient(circle, rgba(20, 24, 31, 0.70) 0 14px, transparent 15px)
          padding: 0px
          --paper-item-icon-color: '#d6d6d6'
          --paper-item-icon-active-color: '#ffd16b'
          --mdc-icon-size: 18px
        tap_action:
          action: toggle
        hold_action:
          action: more-info
      - type: state-icon
        entity: media_player.aoc_h302x_44b3
        title: TV do quarto
        icon: mdi:television
        style:
          top: 50.09%
          left: 45.43%
          transform: translate(-50%, -50%)
          border-radius: 50%
          background: radial-gradient(circle, rgba(20, 24, 31, 0.70) 0 14px, transparent 15px)
          padding: 0px
          --paper-item-icon-color: '#d6d6d6'
          --paper-item-icon-active-color: '#ffd16b'
          --mdc-icon-size: 18px
        tap_action:
          action: toggle
        hold_action:
          action: more-info
  grid_options:
    rows: auto
    columns: full
grid_options:
  rows: auto
  columns: full
